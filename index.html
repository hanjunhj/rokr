    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROKR Showcase</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="showcase">

    <div class="background-blur" id="backgroundBlur"></div>

    <div class="showcase-content">
      <h1>My ROKR Collection</h1>
      <p>Wooden model kits, lights, music and creative design</p>

      <div class="swiper rokrSwiper">
        <div class="swiper-wrapper" id="slideWrapper">
          <!-- Slides loaded by JavaScript -->
        </div>

        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>

      <h2 id="slideTitle">Coffee Factory</h2>
    </div>

  </section>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
</body>
</html>
